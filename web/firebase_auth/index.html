<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; }
    body { margin: 0; background: transparent; color: #e8f1f7; }
    .auth { border: 1px solid #20354d; border-radius: 12px; background: #0d1b2d; padding: 18px; }
    .account { display:flex; align-items:center; gap:12px; }
    .account img { width:42px; height:42px; border-radius:50%; object-fit:cover; border:1px solid #43d9e8; }
    .muted { color:#8ca5b8; font-size: .86rem; }
    button { border:1px solid #43d9e8; border-radius:8px; background:#123747; color:#e8f1f7; padding:9px 13px; cursor:pointer; font-weight:650; display:inline-flex; align-items:center; justify-content:center; gap:8px; }
    button:hover { background:#195267; }
    .google-mark { width:18px; height:18px; flex:0 0 18px; }
    .error { color:#ff9aaa; font-size:.82rem; margin-top:6px; }
    .sign-in { display:flex; align-items:center; justify-content:space-between; gap:16px; }
    @media (max-width: 560px) { .sign-in { align-items:flex-start; flex-direction:column; } }
  </style>
</head>
<body>
  <div id="root" class="auth"><span class="muted">Connecting to Google Sign-In…</span></div>
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import { getAuth, GoogleAuthProvider, browserLocalPersistence, getRedirectResult, onAuthStateChanged, setPersistence, signInWithPopup, signInWithRedirect, signOut } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";

    const root = document.getElementById("root");
    let auth = null;
    let lastState = "";

    function post(value) {
      window.parent.postMessage({ isStreamlitMessage: true, type: "streamlit:setComponentValue", value }, "*");
    }

    function resize() {
      window.parent.postMessage({ isStreamlitMessage: true, type: "streamlit:setFrameHeight", height: Math.max(document.body.scrollHeight, 92) }, "*");
    }

    const googleMark = `<svg class="google-mark" viewBox="0 0 24 24" aria-hidden="true"><path fill="#4285F4" d="M21.35 12.27c0-.73-.07-1.43-.21-2.1H12v3.98h5.24a4.48 4.48 0 0 1-1.94 2.94v2.45h3.14c1.84-1.7 2.91-4.2 2.91-7.27Z"/><path fill="#34A853" d="M12 21.6c2.63 0 4.84-.87 6.45-2.36l-3.14-2.45c-.87.58-1.98.92-3.31.92-2.54 0-4.69-1.72-5.46-4.03H3.3v2.53A9.74 9.74 0 0 0 12 21.6Z"/><path fill="#FBBC05" d="M6.54 13.68A5.85 5.85 0 0 1 6.23 12c0-.58.1-1.14.31-1.68V7.79H3.3A9.74 9.74 0 0 0 2.27 12c0 1.52.36 2.96 1.03 4.21l3.24-2.53Z"/><path fill="#EA4335" d="M12 6.29c1.43 0 2.71.49 3.72 1.45l2.79-2.79C16.84 3.34 14.63 2.4 12 2.4a9.74 9.74 0 0 0-8.7 5.39l3.24 2.53C7.31 8.01 9.46 6.29 12 6.29Z"/></svg>`;

    function showSignedOut(message = "") {
      root.innerHTML = `<div class="sign-in"><div><strong>Google Sign-In required</strong><div class="muted">Sign in to access KAIROS-AI and its Community.</div><div id="auth-error" class="error">${message}</div></div><button id="google-sign-in">${googleMark}<span>Continue with Google</span></button></div>`;
      document.getElementById("google-sign-in").onclick = async () => {
        try {
          await signInWithPopup(auth, new GoogleAuthProvider());
        } catch (error) {
          const code = error?.code || "";
          if (code === "auth/popup-blocked" || code === "auth/operation-not-supported-in-this-environment") {
            try {
              await signInWithRedirect(auth, new GoogleAuthProvider());
              return;
            } catch (redirectError) {
              error = redirectError;
            }
          }
          document.getElementById("auth-error").textContent = error?.message || "Google Sign-In was not completed.";
          resize();
        }
      };
      resize();
    }

    function showSignedIn(user) {
      const photo = user.photoURL ? `<img src="${user.photoURL}" alt="">` : "";
      root.innerHTML = `<div class="account">${photo}<div style="flex:1"><strong>${user.displayName || "Signed-in user"}</strong><div class="muted">Authenticated with Google</div></div><button id="google-sign-out">Sign out</button></div>`;
      document.getElementById("google-sign-out").onclick = () => signOut(auth);
      resize();
    }

    async function publishCurrentUser() {
      const user = auth?.currentUser;
      if (!user) return;
      const idToken = await user.getIdToken();
      showSignedIn(user);
      post({ status: "signed_in", id_token: idToken, display_name: user.displayName || "", photo_url: user.photoURL || "" });
    }

    async function configure(config) {
      if (auth) return;
      const app = initializeApp(config);
      auth = getAuth(app);
      await setPersistence(auth, browserLocalPersistence);
      await getRedirectResult(auth);
      onAuthStateChanged(auth, async (user) => {
        if (!user) {
          lastState = "signed_out";
          showSignedOut();
          post({ status: "signed_out" });
          return;
        }
        const idToken = await user.getIdToken();
        lastState = idToken;
        showSignedIn(user);
        post({ status: "signed_in", id_token: idToken, display_name: user.displayName || "", photo_url: user.photoURL || "" });
      });
      resize();
    }

    window.addEventListener("message", async (event) => {
      const data = event.data || {};
      if (data.type === "streamlit:componentReady") {
        window.parent.postMessage({ isStreamlitMessage: true, type: "streamlit:componentReady", apiVersion: 1 }, "*");
      }
      if (data.type === "streamlit:render" && data.args?.config) {
        try { await configure(data.args.config); await publishCurrentUser(); } catch (error) {
          root.innerHTML = `<div class="muted">Firebase could not be initialized. Check the configured Web API settings.</div>`;
          post({ status: "error", message: error?.message || "Firebase initialization failed." });
        }
      }
    });
    window.parent.postMessage({ isStreamlitMessage: true, type: "streamlit:componentReady", apiVersion: 1 }, "*");
  </script>
</body>
</html>
